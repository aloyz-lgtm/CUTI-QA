<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Pengurusan Shift C — Penyelenggaraan</title>
<style>
  :root {
    --bg: #07090e;
    --accent: #38bdf8;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --card-solid: #111827;
    --border: rgba(56,189,248,0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(56,189,248,0.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(168,85,247,0.1) 0%, transparent 45%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card {
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7), 0 0 30px rgba(56,189,248,0.1);
  }
  .icon {
    font-size: 46px;
    margin-bottom: 16px;
    animation: spin 3s linear infinite;
    display: inline-block;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  h1 {
    font-size: 20px;
    margin: 0 0 10px;
    background: linear-gradient(135deg, #f8fafc, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
  p {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin: 0 0 6px;
  }
  .badge {
    display: inline-block;
    margin-top: 18px;
    font-size: 11px;
    font-weight: 800;
    color: var(--accent);
    background: rgba(56,189,248,0.1);
    border: 1px dashed rgba(56,189,248,0.4);
    padding: 8px 16px;
    border-radius: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⚙️</div>
    <h1>Sistem Pengurusan Shift C</h1>
    <p>Sistem sedang dalam penyelenggaraan buat seketika untuk penambahbaikan.</p>
    <p>Sila cuba semula tidak lama lagi. Terima kasih atas kesabaran.</p>
    <div class="badge">🔧 Akan kembali tidak lama lagi</div>
  </div>
</body>
</html>
